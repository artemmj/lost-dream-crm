  #   environment:
  #     ZOOKEEPER_CLIENT_PORT: 2181
  #   volumes:
  #     - zk_data:/var/lib/zookeeper/data

  # kafka:
  #   image: confluentinc/cp-kafka:7.5.0
  #   depends_on: [zookeeper]
  #   ports: ["9092:9092"]
  #   environment:
  #     KAFKA_BROKER_ID: 1
  #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
  #     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #   volumes:
  #     - kafka_data:/var/lib/kafka/data
  #     - ./kafka/init-topics.sh:/usr/bin/init-topics.sh
  #   command: "bash -c '/usr/bin/init-topics.sh & /etc/confluent/docker/run'"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    # CHANGED: Redis не должен быть доступен извне в продакшене
    expose:
      - "6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-crm:
    image: postgres:18
    environment:
      POSTGRES_DB: db-crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pg_crm_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db-crm"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db-customers:
    image: postgres:18
    environment:
      POSTGRES_DB: db-customers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: [pg_customers_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db-customers"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # db-customers:
  #   image: postgres:18
  #   environment:
  #     POSTGRES_DB: customers_db
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports: ["5432:5432"]
    # volumes: [pg_auth_data:/var/lib/postgresql/data]

  # === SERVICES ===
  service-crm:
    build: ./services/service-crm
    ports: ["8001:8000"]
    env_file: ./services/service-crm/.env
    depends_on:
      db-crm:
        condition: service_healthy
    restart: unless-stopped

  service-auth:
    build: ./services/service-auth
    ports: ["8002:8000"]
    env_file: ./services/service-auth/.env
    restart: unless-stopped

  service-customers:
    build: ./services/service-customers
    ports: ["8003:8000"]
    env_file: ./services/service-customers/.env
    depends_on:
      db-customers:
        condition: service_healthy
    restart: unless-stopped

  # === FRONTEND ===
  # frontend:
  #   build: 
  #     context: ./frontend
  #     target: development  # Multi-stage build
  #   ports: ["3000:3000"]
  #   volumes: ["./frontend/src:/app/src"]  # Hot reload
  #   depends_on: [nginx]

  # === GATEWAY ===
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [service-auth, service-crm]

# volumes:
  # zk_data:
  # kafka_data:
  # ...

volumes:
  pg_crm_data: {}
  pg_customers_data: {}
