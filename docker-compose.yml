services:
  db-crm:
    image: postgres:18
    environment:
      POSTGRES_DB: db-crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pg_crm_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db-crm"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 5s

  db-customers:
    image: postgres:18
    environment:
      POSTGRES_DB: db-customers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes: [pg_customers_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db-customers"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 5s

  service-crm:
    build: ./services/service-crm
    ports: ["8001:8000"]
    env_file: ./services/service-crm/.env
    depends_on:
      db-crm:
        condition: service_started
    restart: unless-stopped

  service-customers:
    build: ./services/service-customers
    ports: ["8002:8000"]
    env_file: ./services/service-customers/.env
    depends_on:
      db-customers:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
      target: development
    ports: ["3000:3000"]
    volumes:
      - ./frontend/src:/app/src       # Hot reload для исходников
      - ./frontend/package.json:/app/package.json # Чтобы видеть изменения зависимостей
      - /app/node_modules             # Анонимный volume, чтобы не перезаписывать node_modules из хоста
    environment:
      - CHOKIDAR_USEPOLLING=true      # Для корректной работы hot-reload на некоторых ОС
    depends_on: 
      - nginx

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [service-crm, service-customers]

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    # CHANGED: Redis не должен быть доступен извне в продакшене
    expose:
      - "6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
# volumes:
  # zk_data:
  # kafka_data:
  # ...

volumes:
  pg_crm_data: {}
  pg_customers_data: {}
