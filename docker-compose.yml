services:
  db-crm:
    image: postgres:18
    environment:
      POSTGRES_DB: db-crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Наружу порты БД не публикуем: доступ только внутри compose-сети
    ports: ["5432:5432"]
    volumes: [pg_crm_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db-crm"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 5s

  db-customers:
    image: postgres:18
    environment:
      POSTGRES_DB: db-customers
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Наружу порты БД не публикуем: доступ только внутри compose-сети
    ports: ["5433:5432"]
    volumes: [pg_customers_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db-customers"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 5s

  service-crm:
    build: ./services/service-crm
    ports: ["8001:8000"]
    env_file: ./services/service-crm/.env
    # Готовность БД не ждём: start.sh сам ретраит миграции до 30 раз.
    # Redis не нужен: сессии и валидация токенов — в service-auth.
    depends_on: [db-crm]
    restart: unless-stopped

  service-auth:
    build: ./services/service-auth
    ports: ["8003:8000"]
    env_file: ./services/service-auth/.env
    # Единственный владелец сессий (Redis) и валидатор токенов/пермишенов
    depends_on: [db-crm, redis]
    restart: unless-stopped

  service-customers:
    build: ./services/service-customers
    ports: ["8002:8000"]
    env_file: ./services/service-customers/.env
    volumes:
      # Миграции синхронизируются с хостом: alembic revision создаст файл прямо в src/
      - ./services/service-customers/src/migrations/versions:/app/src/migrations/versions
    depends_on:
      db-customers:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: development
    ports: ["3000:3000"]
    volumes:
      - ./frontend/src:/app/src       # Hot reload для исходников
      - ./frontend/package.json:/app/package.json # Чтобы видеть изменения зависимостей
      - /app/node_modules             # Анонимный volume, чтобы не перезаписывать node_modules из хоста
    environment:
      - CHOKIDAR_USEPOLLING=true      # Для корректной работы hot-reload на некоторых ОС
    depends_on:
      - nginx

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [service-crm, service-customers]

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    # Redis не должен быть доступен извне в продакшене
    expose:
      - "6379"
    volumes:
      - redis_data:/data              # Персистентность AOF между пересозданиями контейнера
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "redispass"]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    expose: ["9092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    expose: ["8081"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

volumes:
  pg_crm_data: {}
  pg_customers_data: {}
  redis_data: {}