events {
    worker_connections 1024;
}

http {
    upstream crm_backend {
        server service-crm:8000;
    }

    upstream customers_backend {
        server service-customers:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Базовые настройки безопасности и производительности
        client_max_body_size 20M;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;

        server_tokens off;

        # Gzip сжатие
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

        # Общие заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # CRM: /api/v1/crm/orders → crm:8000/orders
        location /api/v1/crm/ {
            proxy_pass http://crm_backend/;
        }

        # CUSTOMERS: /api/v1/customers/info → customers:8000/info
        location /api/v1/customers/ {
            proxy_pass http://customers_backend/;
        }

        # === FRONTEND (с отложенным резолвингом) ===
        location / {
            # Используем переменную для динамического резолвинга DNS Docker
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $frontend_upstream http://frontend:3000;
            
            proxy_pass $frontend_upstream;
            
            # Критически важно для Vite HMR (WebSockets)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Передаем оригинальный хост, чтобы Vite знал, откуда пришел запрос
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check самого gateway
        location /health {
            access_log off;
            return 200 "ok";
            add_header Content-Type text/plain;
        }
    }
}
